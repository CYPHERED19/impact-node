name: impact_node
description: "Impact Node — Two-wheeler crash detection & emergency response app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  flutter_background_service: ^5.0.12
  flutter_local_notifications: ^18.0.1
  supabase_flutter: ^2.8.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.69.2
  http: ^1.2.1
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  path: ^1.9.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/crash_model.tflite
    - assets/scaler_config.json
